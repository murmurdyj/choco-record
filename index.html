<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="治療生活紀錄">
<title>治療生活紀錄</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EEF1EE; --card:#FFFFFF; --ink:#1E2A25; --muted:#6D7872; --line:#E1E6E2;
  --accent:#3F6F5E; --accent-ink:#FFFFFF; --soft:#E0EAE4; --soft-ink:#2F5747;
  --paper:#F6EFDF; --paper-line:#E9DDC4;
  --alert:#B24A3A; --alert-soft:#F7E6E1;
  --bar:#8FB3A2; --bar-empty:#D5DDD8;
  --r-lg:22px; --r-md:14px; --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131816; --card:#1C2320; --ink:#E6ECE8; --muted:#95A29B; --line:#2B3531;
    --accent:#7FB29C; --accent-ink:#0F1A15; --soft:#24332C; --soft-ink:#A9D0BE;
    --paper:#2A2619; --paper-line:#3A3423;
    --alert:#E08A77; --alert-soft:#3A221D;
    --bar:#5F8F7B; --bar-empty:#2F3A35;
  }
}
:root[data-theme="dark"]{
    --bg:#131816; --card:#1C2320; --ink:#E6ECE8; --muted:#95A29B; --line:#2B3531;
    --accent:#7FB29C; --accent-ink:#0F1A15; --soft:#24332C; --soft-ink:#A9D0BE;
    --paper:#2A2619; --paper-line:#3A3423;
    --alert:#E08A77; --alert-soft:#3A221D;
    --bar:#5F8F7B; --bar-empty:#2F3A35;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
body{padding-top:env(safe-area-inset-top,0px)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:.01em}
h1{font-size:28px}
h2{font-size:18px}
h3{font-size:14px;color:var(--muted);font-weight:600;margin:18px 0 8px}
p{margin:0}

/* layout */
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 16px 10px;max-width:560px;margin:0 auto}
.topbar h1{flex:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--bar-empty);display:inline-block}
.sync.on i{background:#4E9A73}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:var(--muted)}
.icon-btn:active{background:var(--soft)}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.page{max-width:560px;margin:0 auto;padding:0 16px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:flex;width:100%;max-width:560px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 8px;font-size:12px;color:var(--muted)}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--accent);font-weight:600}

/* cards */
.card{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-bottom:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.label{font-size:14px;font-weight:600;margin:16px 0 8px;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);font-weight:400}
.muted{color:var(--muted);font-size:13px}
.center{text-align:center}
.pill{font-size:12px;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--soft-ink);white-space:nowrap}

/* date bar */
.datebar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.date-label{position:relative;display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:600;padding:6px 14px;border-radius:99px;background:var(--card)}
.date-label em{font-style:normal;font-size:12px;color:var(--accent);font-weight:600}
.date-label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0}

/* mood */
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 2px 10px;border-radius:var(--r-md);background:var(--bg);font-size:13px;border:2px solid transparent}
.mood .e{font-size:30px;line-height:1.1}
.mood.on{background:var(--soft);border-color:var(--accent);color:var(--soft-ink);font-weight:600}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:99px;background:var(--bg);font-size:14px;border:1.5px solid transparent}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--soft-ink);font-weight:600}
.chips.sm .chip{padding:6px 11px;font-size:13px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--bg);font-size:12px;margin:0 4px 4px 0;color:var(--ink)}
.tag.warn{background:var(--alert-soft);color:var(--alert)}

.followup{margin-top:12px;padding:12px;border-radius:var(--r-md);background:var(--bg)}
.followup .t{font-size:13px;color:var(--muted);margin-bottom:8px}
.urgent{margin-top:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--alert-soft);color:var(--alert);font-size:18px;font-weight:700}

textarea,input[type=text],input[type=email],input[type=password],input[type=date]{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:10px 12px;font-size:16px;outline:none}
textarea{resize:vertical;min-height:64px}
textarea:focus,input:focus{border-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;border-radius:var(--r-md);font-weight:600;font-size:15px;background:var(--soft);color:var(--soft-ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted);padding:8px 10px}
.btn.danger{background:var(--alert-soft);color:var(--alert)}
.btn.big{width:100%;padding:16px;font-size:17px;border-radius:16px;margin-top:18px}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}

.result{margin-top:12px;padding:12px 14px;border-radius:var(--r-md);background:var(--soft);color:var(--soft-ink);font-size:14px;font-weight:600}

/* habits — the one loud element */
.habit-card{padding:0;overflow:hidden}
.habit-hero{display:flex;align-items:center;gap:14px;padding:18px 18px 14px}
.habit-emoji{font-size:64px;line-height:1;width:84px;height:84px;display:grid;place-items:center;border-radius:26px;background:var(--soft);flex:none;transition:transform .25s}
.habit-emoji.pop{transform:scale(1.12) rotate(-6deg)}
.habit-hero .txt{flex:1;min-width:0}
.habit-hero .phrase{font-size:19px;font-weight:650;line-height:1.3}
.habit-hero .count{font-size:13px;color:var(--muted);margin-top:4px}
.habit-list{border-top:1px solid var(--line)}
.habit{display:flex;align-items:center;gap:12px;width:100%;padding:13px 18px;text-align:left;font-size:16px;border-bottom:1px solid var(--line)}
.habit:last-child{border-bottom:0}
.habit .ic{font-size:20px;width:26px;text-align:center}
.habit .t{flex:1}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;font-size:15px;color:transparent;flex:none}
.habit.on .check{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.habit-foot{font-size:11px;color:var(--muted);padding:8px 18px 12px}

/* note board */
.note-card{background:var(--paper)}
.note-body{white-space:pre-wrap;font-size:15px;min-height:24px}
.note-empty{color:var(--muted);font-size:14px}
.note-meta{font-size:12px;color:var(--muted)}
.note-item{background:var(--card);border:1px solid var(--paper-line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.note-item.editing{border-color:var(--accent)}
.note-foot{display:flex;align-items:center;gap:2px;margin-top:6px}
.note-foot .note-meta{flex:1}
.note-foot .btn.ghost{padding:4px 8px;font-size:13px}
.note-card textarea{background:var(--card);border-color:var(--paper-line)}

/* trend */
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 0;border-radius:9px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.custom-dates{display:flex;gap:8px;align-items:center;margin-top:10px}
.custom-dates span{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.stat{background:var(--bg);border-radius:var(--r-md);padding:12px 14px}
.stat b{font-size:26px;font-variant-numeric:tabular-nums;display:block;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}
.insights{list-style:none;padding:0;margin:14px 0 0}
.insights li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.insights li:last-child{border-bottom:0}
.insights .k{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.insights .n{font-variant-numeric:tabular-nums;font-weight:650}
.cols{display:flex;align-items:flex-end;gap:2px;height:96px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.col .b{width:100%;max-width:22px;border-radius:5px 5px 2px 2px;background:var(--bar)}
.col .b.none{height:4px!important;background:var(--bar-empty);border-radius:2px}
.col .b.zero{height:4px!important;background:var(--soft)}
.col-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.hbar{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-size:13px;margin:6px 0}
.hbar .track{height:10px;background:var(--bg);border-radius:99px;overflow:hidden}
.hbar .fill{height:100%;background:var(--bar);border-radius:99px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.fine{font-size:12px;color:var(--muted);margin-top:10px}

/* lists */
.section-h{display:flex;align-items:center;gap:8px;margin:22px 2px 10px}
#recordsList>.section-h:first-child{margin-top:4px}
.section-h h2{flex:1}
.search{display:flex;align-items:center;gap:6px}
.search input{width:150px;padding:7px 10px;font-size:14px}
details.acc{background:var(--card);border-radius:var(--r-lg);margin-bottom:10px}
details.acc summary{list-style:none;padding:14px 16px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
.sum-row{display:flex;align-items:center;gap:10px}
.sum-row .d{font-weight:650;font-variant-numeric:tabular-nums}
.sum-row .w{font-size:13px;color:var(--muted)}
.sum-row .sp{flex:1}
.sum-row .me{font-size:22px}
.sum-row .chev{color:var(--muted);transition:transform .2s;font-size:14px}
details[open] .chev{transform:rotate(90deg)}
.sum-tags{margin-top:6px}
.acc-body{padding:0 16px 16px;border-top:1px solid var(--line)}
.kv{padding-top:12px}
.kv .k{font-size:12px;color:var(--muted);margin-bottom:4px}
.kv .v{white-space:pre-wrap;font-size:15px}
.habit-mini{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.habit-mini .no{color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:12px}
.empty{background:var(--card);border-radius:var(--r-lg);padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.more{display:block;width:100%;padding:12px;color:var(--accent);font-weight:600}

/* life */
.life-sec h3{color:var(--ink);font-size:16px;margin:18px 0 8px}
.life-sec h3:first-child{margin-top:0}
.life-sec ul{margin:0;padding-left:20px}
.life-sec li{margin:3px 0}
.life-sec p{margin:6px 0}
.life-note{background:var(--bg);border-radius:var(--r-md);padding:12px 14px;margin-top:12px;font-size:14px}
.life-note.warn{background:var(--alert-soft);color:var(--alert)}

/* life cards：跟趨勢卡同一套配色（白卡＋灰色內塊＋分隔線） */
.life-card{background:var(--card);border-radius:var(--r-lg);padding:18px;margin-bottom:12px}
.lc-h{margin-bottom:10px}
.lc-h h3{margin:0;color:var(--ink);font-size:18px;font-weight:650}
.life-card.warn .lc-h h3{color:var(--alert)}
.life-card .tags{display:flex;flex-wrap:wrap;gap:8px}
.life-card .tag{margin:0;font-size:14px;padding:6px 12px;background:var(--bg);border-radius:10px}
.life-card ul{list-style:none;margin:0;padding:0}
.life-card li{padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.life-card li:first-child{padding-top:0}
.life-card li:last-child{border-bottom:0;padding-bottom:0}
.life-card p{margin:0;font-size:15px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:30}
.sheet-backdrop{position:absolute;inset:0;background:rgba(10,20,15,.38)}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;max-height:92%;overflow:auto;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
.sheet-grip{width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 12px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-panel{animation:none}.habit-emoji{transition:none}}
.field{display:block;margin-top:14px}
.field>span{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
pre.summary{white-space:pre-wrap;word-break:break-word;font-family:var(--font);font-size:14px;line-height:1.65;background:var(--bg);border-radius:var(--r-md);padding:14px;margin:14px 0 0;max-height:52vh;overflow:auto}

/* auth screens */
.screen{max-width:440px;margin:0 auto;padding:40px 20px}
.brand{font-size:44px;margin-bottom:8px}
.screen h1{margin-bottom:6px}
.screen .lead{color:var(--muted);margin-bottom:22px}
.code{font-size:28px;font-weight:700;letter-spacing:.18em;font-variant-numeric:tabular-nums}
.err{color:var(--alert);font-size:14px;margin-top:10px;min-height:1em}

#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1}

.banner{margin:0 0 12px;padding:10px 14px;border-radius:14px;background:var(--soft);color:var(--soft-ink);font-size:13px}
.banner.warn{background:var(--alert-soft);color:var(--alert)}
.banner button{text-decoration:underline;font-weight:600;color:inherit;font-size:13px;padding:0 0 0 4px}
.who-list{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.who{padding:16px;font-size:17px}
#printArea{display:none}
@media print{
  body.print-summary > *:not(#printArea){display:none!important}
  body.print-summary #printArea{display:block}
  #printArea pre{white-space:pre-wrap;font-family:var(--font);font-size:13pt;line-height:1.7;color:#000}
  html,body{background:#fff}
}
</style>
</head>
<body>

<!-- 載入中 -->
<div id="screen-loading" class="screen center"><div class="brand">🌿</div><p class="muted">載入中…</p></div>

<!-- 首次設定：Supabase 連線 -->
<div id="screen-setup" class="screen hidden">
  <div class="brand">🔌</div>
  <h1>連線設定</h1>
  <p class="lead">填入 Supabase 專案的 URL 與 anon（publishable）key。建議直接寫進 index.html 頂端的 CONFIG，兩支手機就不用各自設定。</p>
  <label class="field"><span>Project URL</span><input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co" autocomplete="off"></label>
  <label class="field"><span>anon / publishable key</span><input type="text" id="cfgKey" autocomplete="off"></label>
  <button class="btn primary big" data-action="saveConfig">儲存並連線</button>
  <button class="btn ghost" style="margin-top:10px" data-action="goDemo">先看示範</button>
</div>

<!-- 登入／註冊 -->
<div id="screen-auth" class="screen hidden">
  <div class="brand">🌿</div>
  <h1>治療生活紀錄</h1>
  <p class="lead">兩支手機登入同一個帳號，就會看到同一份紀錄。每支手機只要登入一次。</p>
  <div class="seg" id="authSeg">
    <button class="on" data-action="authMode" data-v="login">登入</button>
    <button data-action="authMode" data-v="signup">第一次使用</button>
  </div>
  <label class="field"><span>Email</span><input type="email" id="authEmail" autocomplete="email" inputmode="email"></label>
  <label class="field"><span>密碼</span><input type="password" id="authPw" autocomplete="current-password" placeholder="至少 6 個字元"></label>
  <button class="btn primary big" id="authBtn" data-action="authSubmit">登入</button>
  <div class="err" id="authErr"></div>
</div>

<!-- 主畫面 -->
<div id="screen-main" class="hidden">
  <header class="topbar">
    <h1 id="pageTitle">今日</h1>
    <div class="sync" id="syncDot"><i></i><span>連線中</span></div>
    <button class="icon-btn" data-action="openSettings" aria-label="設定">⚙︎</button>
  </header>
  <main>
    <div class="page">
      <div id="demoBanner" class="banner hidden">示範模式：這些是假資料，只存在這個頁面，重新整理就會重置。<button data-action="goSetup">連接 Supabase</button></div>
      <div id="netBanner" class="banner warn hidden" role="alert"></div>
    </div>
    <section class="page" id="page-today">
      <div id="todayDateBar"></div>
      <div id="todayForm"></div>
      <div id="todayHabits"></div>
      <div id="todayNote"></div>
    </section>
    <section class="page hidden" id="page-trend">
      <div id="trendCard"></div>
    </section>
    <section class="page hidden" id="page-records">
      <div id="recordsList"></div>
    </section>
    <section class="page hidden" id="page-treat"></section>
    <section class="page hidden" id="page-life"></section>
  </main>
  <nav class="tabbar"><div class="in">
    <button class="tab on" data-action="tab" data-t="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>今日</button>
    <button class="tab" data-action="tab" data-t="records"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>紀錄</button>
    <button class="tab" data-action="tab" data-t="treat"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M9 2v4M15 2v4M12 10v6M9 13h6"/></svg>治療</button>
    <button class="tab" data-action="tab" data-t="trend"><svg viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>趨勢</button>

<script>
/* ============================================================
   設定：把 Supabase 專案的 URL 與 anon key 填在這裡
   ============================================================ */
const CONFIG = {
  SUPABASE_URL: 'https://xgvacbutmkqacsdevmbo.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhndmFjYnV0bWtxYWNzZGV2bWJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxMzAwMTEsImV4cCI6MjEwNTcwNjAxMX0.FL0INBjpfCJ5-GYcWMoMJxkDIfRLUxHlTnd3LAW7hpw'
};

/* ---------- 常數 ---------- */
const MOODS = [
  { v: 'good', e: '😊', t: '還不錯' },
  { v: 'ok', e: '😐', t: '普通' },
  { v: 'uncomfortable', e: '😣', t: '不太舒服' },
  { v: 'bad', e: '🥴', t: '很不舒服' }
];
const MOOD = Object.fromEntries(MOODS.map(m => [m.v, m]));
const SYMPTOMS = ['腹部悶痛','單側下腹痛','腹脹','腰痠','熱潮紅','夜間熱醒','盜汗','頭痛','頭暈','噁心','疲倦','睡不好','情緒波動','陰道乾澀','出血／點狀出血','其他'];
const FLAGS = ['突然、劇烈','噁心嘔吐','冒冷汗','站不住'];
const HABITS = [
  { k: 'calcium', t: '有吃到鈣質', s: '鈣質', e: '🥛' },
  { k: 'protein', t: '有吃到蛋白質', s: '蛋白質', e: '🥚' },
  { k: 'exercise', t: '有活動／運動', s: '活動／運動', e: '🚶' },
  { k: 'water', t: '有正常喝水', s: '正常喝水', e: '💧' },
  { k: 'no_heavy_alcohol', t: '沒有大量喝酒', s: '沒有大量喝酒', e: '🍵' }
];
// 只反映「生活打卡完成度」
const HABIT_EMOJI = [
  [['🫠','今天還在待機'], ['🦥','慢慢開機中'], ['🥱','還沒開始打卡']],
  [['🐣','有顧到一點自己'], ['🌱','冒出一點小芽'], ['🐢','慢慢來，有開始了']],
  [['🌿','今天有在照顧自己'], ['🍵','穩穩地照顧自己'], ['🐝','有在認真照顧自己']],
  [['😎','今天狀態不錯'], ['🐧','照顧自己很有節奏'], ['🌻','今天很會顧自己']],
  [['🦦✨','今天很會照顧自己'], ['🐳✨','五項全部打卡'], ['🏅','生活打卡全滿']]
];
const PAGE_TITLES = { today: '今日', trend: '趨勢', records: '紀錄', treat: '治療', life: '生活' };

/* ---------- 狀態 ---------- */
let sb = null;
const S = {
  user: null, space: null, who: '', demo: false, sheetLocked: false,
  records: [], recByDate: {}, habitByRec: {}, treatments: [], notes: [],
  today: null, lastResult: null, pendingHabits: {}, emojiShift: 0,
  noteEditing: null, tab: 'today',
  trend: { p: '7', from: '', to: '' },
  sum: { p: '30', from: '', to: '' },
  recSearch: '', recLimit: 30, treatSearch: '',
  openRec: new Set(), openTreat: new Set(),
  channel: null, authMode: 'login'
};

/* ---------- 工具 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return ymd(d); };
const todayStr = () => ymd(new Date());
const md = s => { const d = parseD(s); return `${d.getMonth() + 1}/${d.getDate()}`; };
const wd = s => '週' + '日一二三四五六'[parseD(s).getDay()];
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
function rangeDays(from, to) { const out = []; let s = from; while (s <= to) { out.push(s); s = addDays(s, 1); } return out; }
const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const nameOf = n => n || '—';
const hasSym = (r, s) => (r.symptoms || []).includes(s);
function timeStr(iso) { if (!iso) return ''; const d = new Date(iso); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
let toastTimer;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

function show(screen) {
  ['loading', 'setup', 'auth'].forEach(n => $('screen-' + n).classList.toggle('hidden', n !== screen));
  $('screen-main').classList.toggle('hidden', screen !== 'main');
}

/* ---------- 啟動 ---------- */
async function init() {
  const url = CONFIG.SUPABASE_URL || lsGet('tl_url');
  const key = CONFIG.SUPABASE_ANON_KEY || lsGet('tl_key');
  if (location.hash === '#setup') return show('setup');
  if (!url || !key) { S.demo = true; sb = createMockClient(); }
  else {
    if (!window.supabase) { show('auth'); $('authErr').textContent = '無法載入 Supabase 套件，請確認網路後重新整理'; return; }
    sb = window.supabase.createClient(url, key, { auth: { persistSession: true, autoRefreshToken: true } });
  }
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT') { teardown(); show('auth'); } });
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('auth');
  await afterLogin(session.user);
}

async function afterLogin(user) {
  S.user = user;
  const fail = e => { show('auth'); $('authErr').style.color = ''; $('authErr').textContent = friendlyError(e); };
  const { data: mem, error } = await sb.from('care_space_members').select('care_space_id')
    .eq('user_id', user.id).order('joined_at', { ascending: true }).limit(1);
  if (error) return fail(error);
  let sid = mem && mem[0] && mem[0].care_space_id;
  if (!sid) {
    const { data, error: e2 } = await sb.rpc('create_care_space', { p_name: '我們的治療紀錄' });
    if (e2) return fail(e2);
    sid = (Array.isArray(data) ? data[0] : data).id;
  }
  const { data: sp, error: e3 } = await sb.from('care_spaces').select('*').eq('id', sid).single();
  if (e3) return fail(e3);
  S.space = sp;
  await enterSpace();
}

async function enterSpace() {
  show('main');
  $('demoBanner').classList.toggle('hidden', !S.demo);
  S.trend.to = todayStr(); S.trend.from = addDays(S.trend.to, -6);
  S.who = lsGet('tl_who') || '';
  await loadAll();
  setTodayDate(todayStr(), true);
  renderLife();
  renderAll();
  subscribe();
  if (!whoValid()) openWhoPicker();
}

function friendlyError(e) {
  const m = (e && e.message) || String(e || '');
  if (/fetch|network|Load failed/i.test(m)) return '無法連線到資料庫。資料不一定消失了：Supabase 免費專案一段時間沒使用會被暫停，請到 Supabase 後台確認專案狀態，必要時按 Restore。';
  if (/does not exist|schema cache/i.test(m)) return '找不到資料表，請確認已在 Supabase 執行 schema.sql。（' + m + '）';
  return m;
}

function teardown() {
  if (S.channel) { sb.removeChannel(S.channel); S.channel = null; }
  S.space = null; S.records = []; S.treatments = []; S.notes = [];
}

/* ---------- 資料 ---------- */
async function loadAll() {
  const sid = S.space.id;
  const [r, h, t, n, sp] = await Promise.all([
    sb.from('daily_records').select('*').eq('care_space_id', sid).order('record_date', { ascending: false }),
    sb.from('daily_habits').select('*').eq('care_space_id', sid),
    sb.from('treatments').select('*').eq('care_space_id', sid).order('treatment_date', { ascending: false }).order('created_at', { ascending: false }),
    sb.from('shared_notes').select('*').eq('care_space_id', sid).order('created_at', { ascending: true }),
    sb.from('care_spaces').select('*').eq('id', sid).maybeSingle()
  ]).catch(e => [{ error: e }, {}, {}, {}, {}]);
  const err = r.error || h.error || t.error || n.error || sp.error;
  const nb = $('netBanner');
  if (err) { nb.textContent = friendlyError(err) + ' 畫面上是最後一次成功讀取的內容。'; nb.classList.remove('hidden'); return false; }
  nb.classList.add('hidden');
  if (sp.data) S.space = sp.data;
  S.records = r.data || [];
  S.habitByRec = {}; (h.data || []).forEach(x => S.habitByRec[x.daily_record_id] = x);
  S.treatments = t.data || [];
  S.notes = n.data || [];
  indexRecords();
}

function indexRecords() {
  S.records.sort((a, b) => b.record_date.localeCompare(a.record_date));
  S.recByDate = {}; S.records.forEach(r => S.recByDate[r.record_date] = r);
}
function upsertLocalRecord(rec) {
  const i = S.records.findIndex(r => r.id === rec.id);
  if (i >= 0) S.records[i] = rec; else S.records.push(rec);
  indexRecords();
}

let remoteTimer;
function subscribe() {
  if (S.channel) sb.removeChannel(S.channel);
  const onRemote = () => {
    clearTimeout(remoteTimer);
    remoteTimer = setTimeout(async () => {
      const before = JSON.stringify(S.notes);
      await loadAll();
      if (S.noteEditing && JSON.stringify(S.notes) !== before) toast('另一位剛更新了留言板');
      renderAll(true);
    }, 250);
  };
  let ch = sb.channel('space-' + S.space.id);
  ['daily_records', 'daily_habits', 'treatments', 'shared_notes', 'care_spaces'].forEach(tb => {
    ch = ch.on('postgres_changes', { event: '*', schema: 'public', table: tb }, onRemote);
  });
  S.channel = ch.subscribe(status => setSync(status === 'SUBSCRIBED'));
}
function setSync(on) {
  const el = $('syncDot'); el.classList.toggle('on', on);
  el.querySelector('span').textContent = S.demo ? '示範' : on ? '已同步' : '重新連線中';
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && S.space) { await loadAll(); renderAll(true); }
});

/* ---------- 今日：狀態 ---------- */
function setTodayDate(date, force) {
  if (!force && S.today && S.today.dirty && S.today.date !== date) {
    if (!confirm('目前的修改還沒按「完成今日紀錄」，確定切換日期？')) { renderDateBar(); return; }
  }
  const rec = S.recByDate[date];
  if (!S.today || S.today.date !== date) S.emojiShift = 0;
  S.today = {
    date,
    mood: rec ? rec.mood : null,
    symptoms: new Set(rec ? rec.symptoms || [] : []),
    flags: new Set(rec ? rec.red_flags || [] : []),
    note: rec ? rec.note || '' : '',
    dirty: false
  };
  renderDateBar(); renderTodayForm(true); renderHabits();
}

function isUrgent(t) {
  return t.symptoms.has('單側下腹痛') && t.flags.has('突然、劇烈') &&
    (t.flags.has('噁心嘔吐') || t.flags.has('冒冷汗') || t.flags.has('站不住') || t.symptoms.has('噁心'));
}

/* ---------- 今日：畫面 ---------- */
function renderDateBar() {
  const d = S.today.date, isToday = d === todayStr();
  $('todayDateBar').innerHTML = `
    <div class="datebar">
      <button class="icon-btn" data-action="prevDay" aria-label="前一天">‹</button>
      <label class="date-label">${md(d)} ${wd(d)} ${isToday ? '<em>今天</em>' : ''}
        <input type="date" data-bind="dateJump" value="${d}" max="${todayStr()}" aria-label="選擇日期">
      </label>
      <button class="icon-btn" data-action="nextDay" aria-label="後一天" ${isToday ? 'disabled' : ''}>›</button>
    </div>`;
}

function renderTodayForm(force) {
  const box = $('todayForm');
  if (!force && (S.today.dirty || box.contains(document.activeElement) && document.activeElement.tagName === 'TEXTAREA')) return;
  const t = S.today, rec = S.recByDate[t.date], done = rec && rec.mood;
  const res = S.lastResult && S.lastResult.date === t.date ? S.lastResult.text : '';
  box.innerHTML = `
  <div class="card">
    <div class="card-h"><h2>今日身體紀錄</h2>${done ? `<span class="pill">已記錄・${esc(nameOf(rec.updated_by_name))}</span>` : ''}</div>
    <div class="label">今天整體感覺</div>
    <div class="moods">${MOODS.map(m => `
      <button class="mood ${t.mood === m.v ? 'on' : ''}" data-action="mood" data-v="${m.v}" aria-pressed="${t.mood === m.v}">
        <span class="e">${m.e}</span><span>${m.t}</span></button>`).join('')}
    </div>
    <div class="label">今天有什麼狀況 <span class="hint">可複選，沒有就不用選</span></div>
    <div class="chips">${SYMPTOMS.map(s => `
      <button class="chip ${t.symptoms.has(s) ? 'on' : ''}" data-action="sym" data-v="${esc(s)}" aria-pressed="${t.symptoms.has(s)}">${esc(s)}</button>`).join('')}
    </div>
    ${t.symptoms.has('單側下腹痛') ? `
      <div class="followup">
        <div class="t">單側下腹痛時，有沒有以下情況？</div>
        <div class="chips sm">${FLAGS.map(f => `<button class="chip ${t.flags.has(f) ? 'on' : ''}" data-action="flag" data-v="${esc(f)}">${esc(f)}</button>`).join('')}</div>
      </div>` : ''}
    ${isUrgent(t) ? '<div class="urgent" role="alert">請儘快就醫。</div>' : ''}
    <div class="label">補充說明 <span class="hint">非必填</span></div>
    <textarea data-bind="todayNote" rows="2" placeholder="例如：晚上熱醒 2 次、右下腹悶痛約 3/10">${esc(t.note)}</textarea>
    <button class="btn primary big" data-action="saveToday" ${t.mood ? '' : 'disabled'}>${done ? '更新今日紀錄' : '完成今日紀錄'}</button>
    ${!t.mood ? '<p class="hint center" style="margin-top:8px">先選「今天整體感覺」就可以完成</p>' : ''}
    ${res ? `<div class="result" role="status">✓ ${esc(res)}</div>` : ''}
  </div>`;
}

function currentHabits() {
  const d = S.today.date;
  if (S.pendingHabits[d]) return S.pendingHabits[d];
  const rec = S.recByDate[d];
  return (rec && S.habitByRec[rec.id]) || {};
}

function renderHabits(pop) {
  const h = currentHabits();
  const n = HABITS.filter(x => h[x.k]).length;
  const lvl = n === 0 ? 0 : n <= 2 ? 1 : n === 3 ? 2 : n === 4 ? 3 : 4;
  const set = HABIT_EMOJI[lvl];
  const [emo, phrase] = set[(hash(S.today.date) + S.emojiShift) % set.length];
  $('todayHabits').innerHTML = `
  <div class="card habit-card">
    <div class="habit-hero">
      <div class="txt">
        <h2 style="font-size:14px;color:var(--muted);font-weight:600;margin-bottom:4px">今日生活打卡</h2>
        <div class="phrase">${esc(phrase)}</div>
        <div class="count">${n} / 5 項</div>
      </div>
      <button class="habit-emoji ${pop ? 'pop' : ''}" data-action="shuffleEmoji" aria-label="換一個表情">${emo}</button>
    </div>
    <div class="habit-list">${HABITS.map(x => `
      <button class="habit ${h[x.k] ? 'on' : ''}" data-action="habit" data-k="${x.k}" role="checkbox" aria-checked="${!!h[x.k]}">
        <span class="ic">${x.e}</span><span class="t">${x.t}</span><span class="check">✓</span>
      </button>`).join('')}
    </div>
    <div class="habit-foot">勾選會自動同步。表情只反映打卡項目數，不代表身體狀況。</div>
  </div>`;
  if (pop) setTimeout(() => { const e = document.querySelector('.habit-emoji'); e && e.classList.remove('pop'); }, 220);
}

function renderNote(force) {
  if (S.noteEditing && !force) return;
  const notes = S.notes || [];
  if (S.noteEditing && S.noteEditing !== 'new' && !notes.some(n => n.id === S.noteEditing)) S.noteEditing = null;
  const ed = S.noteEditing;
  const editor = (id, val) => `
    <div class="note-item editing">
      <textarea id="noteInput" rows="3" maxlength="200" placeholder="例如：晚上幫忙記得補紀錄">${esc(val)}</textarea>
      <div class="btn-row"><button class="btn sm" data-action="cancelNote">取消</button><button class="btn sm primary" data-action="saveNote" data-id="${id}">儲存</button></div>
    </div>`;
  $('todayNote').innerHTML = `
  <div class="card note-card">
    <div class="card-h"><h2>📌 小留言板</h2><span class="muted">${notes.length} / 3</span></div>
    ${notes.map(n => ed === n.id ? editor(n.id, n.content) : `
      <div class="note-item">
        <div class="note-body">${esc(n.content)}</div>
        <div class="note-foot"><span class="note-meta">${esc(nameOf(n.updated_by_name))}・${timeStr(n.updated_at)}</span>
          ${ed ? '' : `<button class="btn ghost" data-action="editNote" data-id="${n.id}">編輯</button><button class="btn ghost" data-action="delNote" data-id="${n.id}">刪除</button>`}</div>
      </div>`).join('')}
    ${ed === 'new' ? editor('', '') : ''}
    ${!notes.length && ed !== 'new' ? '<div class="note-empty" style="margin-bottom:10px">還沒有留言。可以寫：「下次回診記得問柳培林療程」</div>' : ''}
    ${!ed && notes.length < 3 ? '<button class="btn sm" data-action="newNote">＋ 新增留言</button>' : ''}
    ${!ed && notes.length >= 3 ? '<div class="note-empty" style="font-size:12px">最多 3 則，刪掉一則才能再新增</div>' : ''}
  </div>`;
}
function focusNote() { const ta = $('noteInput'); if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); } }

/* ---------- 今日：動作 ---------- */
async function saveToday(btn) {
  const t = S.today; if (!t.mood) return;
  btn.disabled = true; btn.textContent = '儲存中…';
  const syms = SYMPTOMS.filter(s => t.symptoms.has(s));
  const flags = t.symptoms.has('單側下腹痛') ? FLAGS.filter(f => t.flags.has(f)) : [];
  const { data, error } = await sb.from('daily_records').upsert({
    care_space_id: S.space.id, record_date: t.date, mood: t.mood,
    symptoms: syms, red_flags: flags, note: t.note.trim() || null, updated_by_name: S.who || null
  }, { onConflict: 'care_space_id,record_date' }).select().single();
  if (error) { toast('儲存失敗：' + error.message); btn.disabled = false; btn.textContent = '完成今日紀錄'; return; }
  upsertLocalRecord(data);
  t.dirty = false;
  S.lastResult = { date: t.date, text: `${md(t.date)} 已完成：${MOOD[t.mood].t}｜${syms.length ? syms.join('、') : '沒有特別狀況'}` };
  renderTodayForm(true); renderTrend(); renderRecords();
}

let habitTimer;
function toggleHabit(k) {
  const d = S.today.date;
  const cur = { ...currentHabits() };
  HABITS.forEach(x => cur[x.k] = !!cur[x.k]);
  cur[k] = !cur[k];
  S.pendingHabits[d] = cur;
  renderHabits(true);
  clearTimeout(habitTimer);
  habitTimer = setTimeout(() => saveHabits(d), 450);
}

async function saveHabits(date) {
  const vals = S.pendingHabits[date]; if (!vals) return;
  let rec = S.recByDate[date];
  if (!rec) {
    const { data, error } = await sb.from('daily_records')
      .upsert({ care_space_id: S.space.id, record_date: date, updated_by_name: S.who || null }, { onConflict: 'care_space_id,record_date' })
      .select().single();
    if (error) { toast('打卡同步失敗：' + error.message); return; }
    rec = data; upsertLocalRecord(rec);
  }
  const row = { daily_record_id: rec.id, care_space_id: S.space.id };
  HABITS.forEach(x => row[x.k] = !!vals[x.k]);
  const { data, error } = await sb.from('daily_habits').upsert(row, { onConflict: 'daily_record_id' }).select().single();
  if (error) { toast('打卡同步失敗：' + error.message); return; }
  S.habitByRec[rec.id] = data;
  if (S.pendingHabits[date] === vals) delete S.pendingHabits[date];
  renderTrend(); renderRecords();
}

async function saveNote(btn) {
  const content = $('noteInput').value.trim(), id = btn.dataset.id;
  if (!content) { toast('留言是空的'); return; }
  btn.disabled = true;
  const q = id
    ? sb.from('shared_notes').update({ content, updated_by_name: S.who || null }).eq('id', id)
    : sb.from('shared_notes').insert({ care_space_id: S.space.id, content, updated_by_name: S.who || null });
  const { data, error } = await q.select().single();
  if (error) { btn.disabled = false; toast(/最多/.test(error.message) ? '留言板最多 3 則' : '儲存失敗：' + friendlyError(error)); return; }
  const i = S.notes.findIndex(n => n.id === data.id);
  if (i >= 0) S.notes[i] = data; else S.notes.push(data);
  S.noteEditing = null; renderNote(true); toast('留言已儲存');
}
async function delNote(id) {
  if (!confirm('確定刪除這則留言？')) return;
  const { error } = await sb.from('shared_notes').delete().eq('id', id);
  if (error) return toast('刪除失敗：' + friendlyError(error));
  S.notes = S.notes.filter(n => n.id !== id); renderNote(true); toast('已刪除');
}

/* ---------- 分析（只根據實際輸入資料） ---------- */
function countSyms(recs) {
  const c = {}; recs.forEach(r => (r.symptoms || []).forEach(s => c[s] = (c[s] || 0) + 1)); return c;
}
function analyze(from, to) {
  const days = rangeDays(from, to), N = days.length;
  const inRange = r => r.record_date >= from && r.record_date <= to;
  const recs = S.records.filter(r => inRange(r) && r.mood).sort((a, b) => a.record_date.localeCompare(b.record_date));
  const cnt = countSyms(recs);
  const order = s => SYMPTOMS.indexOf(s);
  const sorted = Object.entries(cnt).sort((a, b) => b[1] - a[1] || order(a[0]) - order(b[0]));

  const pf = addDays(from, -N), pt = addDays(from, -1);
  const prev = S.records.filter(r => r.record_date >= pf && r.record_date <= pt && r.mood);
  const pc = countSyms(prev);
  const changes = [];
  if (prev.length && recs.length) {
    new Set([...Object.keys(cnt), ...Object.keys(pc)]).forEach(s => {
      const a = pc[s] || 0, b = cnt[s] || 0; if (a !== b) changes.push({ s, prev: a, cur: b });
    });
    changes.sort((x, y) => Math.abs(y.cur - y.prev) - Math.abs(x.cur - x.prev) || order(x.s) - order(y.s));
  }

  const coFor = (a) => {
    const withA = recs.filter(r => hasSym(r, a)); if (withA.length < 2) return null;
    let best = null;
    SYMPTOMS.forEach(s => {
      if (s === a || s === '其他') return;
      const c = withA.filter(r => hasSym(r, s)).length;
      if (c >= 2 && (!best || c > best.c)) best = { s, c };
    });
    return best ? { a, aCount: withA.length, b: best.s, c: best.c } : null;
  };
  const co = sorted.length ? coFor(sorted[0][0]) : null;
  const pair = (a, b) => ({ a, b, aCount: recs.filter(r => hasSym(r, a)).length, c: recs.filter(r => hasSym(r, a) && hasSym(r, b)).length });

  const hRows = S.records.filter(inRange).map(r => S.habitByRec[r.id]).filter(Boolean);
  const per = {}; let total = 0;
  hRows.forEach(h => HABITS.forEach(x => { if (h[x.k]) { per[x.k] = (per[x.k] || 0) + 1; total++; } }));
  const habitAvg = hRows.length ? Math.round(total / hRows.length * 10) / 10 : null;

  const series = days.map(d => { const r = S.recByDate[d]; return { d, v: r && r.mood ? (r.symptoms || []).length : null }; });
  const moodCnt = {}; recs.forEach(r => moodCnt[r.mood] = (moodCnt[r.mood] || 0) + 1);

  return { from, to, N, recs, recDays: recs.length, cnt, sorted, prev, pf, pt, changes, co, pair,
           hDays: hRows.length, per, habitAvg, series, moodCnt,
           notes: recs.filter(r => r.note), flagged: recs.filter(r => (r.red_flags || []).length) };
}

function periodRange(o) {
  const to = todayStr();
  if (o.p === 'custom') return { from: o.from || addDays(to, -6), to: o.to || to };
  return { from: addDays(to, -(Number(o.p) - 1)), to };
}
const changeText = c => `${c.s}：前一期 ${c.prev} 天 → 本期 ${c.cur} 天（頻率${c.cur > c.prev ? '增加' : '下降'}）`;

/* ---------- 紀錄頁 ---------- */
function segHTML(o, action) {
  return `<div class="seg">${[['7','近 7 天'],['14','近 14 天'],['30','近 30 天'],['custom','自訂']].map(([v, t]) =>
    `<button class="${o.p === v ? 'on' : ''}" data-action="${action}" data-v="${v}">${t}</button>`).join('')}</div>
  ${o.p === 'custom' ? `<div class="custom-dates">
    <input type="date" data-bind="${action}From" value="${o.from}" max="${todayStr()}"><span>至</span>
    <input type="date" data-bind="${action}To" value="${o.to}" max="${todayStr()}"></div>` : ''}`;
}

function renderTrend(fromRemote) {
  const box = $('trendCard');
  if (fromRemote && box.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  const { from, to } = periodRange(S.trend);
  if (from > to) { box.innerHTML = `<div class="card"><div class="card-h"><h2>趨勢分析</h2></div>${segHTML(S.trend, 'trendP')}<p class="err">開始日期要早於結束日期</p></div>`; return; }
  const A = analyze(from, to);
  let body = '';
  if (!A.recDays) {
    body = `<p class="empty" style="margin-top:14px;padding:18px">這段期間還沒有完成的身體紀錄。到「今日」頁記錄後，這裡會自動整理。</p>`;
  } else {
    const items = [];
    if (A.sorted[0]) items.push(`<li><span class="k">最常出現</span>${esc(A.sorted[0][0])} <span class="n">${A.sorted[0][1]} / ${A.recDays} 天</span></li>`);
    if (A.sorted[1]) items.push(`<li><span class="k">第二常見</span>${esc(A.sorted[1][0])} <span class="n">${A.sorted[1][1]} / ${A.recDays} 天</span></li>`);
    if (!A.sorted.length) items.push(`<li><span class="k">症狀</span>這段期間沒有勾選任何狀況</li>`);
    if (A.co) items.push(`<li><span class="k">常同時出現</span>${esc(A.co.a)}有 ${A.co.aCount} 天，其中 ${A.co.c} 天同時出現${esc(A.co.b)}</li>`);
    if (A.changes.length) items.push(`<li><span class="k">與前一期（${md(A.pf)}–${md(A.pt)}）相比</span>${A.changes.slice(0, 3).map(c => esc(changeText(c))).join('<br>')}<div class="fine" style="margin-top:4px">前一期有紀錄 ${A.prev.length} 天，本期 ${A.recDays} 天</div></li>`);
    else if (!A.prev.length) items.push(`<li><span class="k">與前一期相比</span><span class="muted">前一期沒有紀錄，暫時無法比較</span></li>`);
    if (A.habitAvg !== null) items.push(`<li><span class="k">生活打卡</span>平均完成 <span class="n">${A.habitAvg}</span> 項（${A.hDays} 天有打卡）</li>`);

    const max = Math.max(1, ...A.series.map(x => x.v || 0));
    const bars = A.series.map(x => `<div class="col" title="${md(x.d)}：${x.v === null ? '無紀錄' : x.v + ' 項'}"><div class="b ${x.v === null ? 'none' : x.v === 0 ? 'zero' : ''}" style="height:${x.v ? Math.max(8, x.v / max * 100) : 0}%"></div></div>`).join('');
    const mid = A.series[Math.floor(A.series.length / 2)];
    const hmax = A.sorted.length ? A.sorted[0][1] : 1;
    body = `
      <div class="stats">
        <div class="stat"><b>${A.recDays}<small style="font-size:14px;color:var(--muted)"> / ${A.N}</small></b><span>天有身體紀錄</span></div>
        <div class="stat"><b>${A.habitAvg === null ? '—' : A.habitAvg}</b><span>平均生活打卡（項）</span></div>
      </div>
      <ul class="insights">${items.join('')}</ul>
      <h3>每日勾選的症狀數</h3>
      <div class="cols">${bars}</div>
      <div class="col-labels"><span>${md(from)}</span>${A.N > 2 ? `<span>${md(mid.d)}</span>` : ''}<span>${md(to)}</span></div>
      <div class="fine">灰色短線＝當天沒有身體紀錄</div>
      ${A.sorted.length ? `<h3>症狀出現天數</h3>${A.sorted.slice(0, 8).map(([s, c]) => `
        <div class="hbar"><span>${esc(s)}</span><div class="track"><div class="fill" style="width:${c / hmax * 100}%"></div></div><span class="v">${c} 天</span></div>`).join('')}` : ''}`;
  }
  box.innerHTML = `
  <div class="card">
    <div class="card-h"><h2>趨勢分析</h2><span class="muted">${md(from)}–${md(to)}</span></div>
    ${segHTML(S.trend, 'trendP')}
    ${body}
    <button class="btn primary big" data-action="openSummary">產生回診摘要</button>
    <p class="fine">以上只整理你們輸入的紀錄（頻率、變化、同時出現），不做醫療判斷，可於回診時提供醫師參考。</p>
  </div>`;
}

function renderRecords() {
  const q = S.recSearch;

  const shown = list.slice(0, S.recLimit);

  <div class="section-h"><h2>每日紀錄</h2>

    ${q ? '<button class="btn ghost sm" data-action="clearRecSearch">清除</button>' : ''}</div></div>
  ${!shown.length ? `<div class="empty">${q ? `${md(q)} 沒有紀錄` : '還沒有紀錄，從「今日」頁開始記錄吧。'}</div>` :
    shown.map(recordHTML).join('')}
  ${list.length > shown.length ? '<button class="more" data-action="moreRecs">顯示更多</button>' : ''}`;

function recordHTML(r) {
  const syms = r.symptoms || [], h = S.habitByRec[r.id], flags = r.red_flags || [];

        <span class="sp"></span>

        <span class="chev">›</span></div>
      ${syms.length ? `<div class="sum-tags">${syms.slice(0, 3).map(s => `<span class="tag">${esc(s)}</span>`).join('')}${syms.length > 3 ? `<span class="tag">+${syms.length - 3}</span>` : ''}</div>` : ''}
    </summary>
    <div class="acc-body">
      <div class="kv"><div class="k">所有狀況</div><div class="v">${syms.length ? syms.map(s => `<span class="tag">${esc(s)}</span>`).join('') : (r.mood ? '沒有勾選' : '—')}</div></div>
      ${flags.length ? `<div class="kv"><div class="k">單側下腹痛時</div><div class="v">${flags.map(f => `<span class="tag warn">${esc(f)}</span>`).join('')}</div></div>` : ''}
      ${r.note ? `<div class="kv"><div class="k">補充說明</div><div class="v">${esc(r.note)}</div></div>` : ''}
      <div class="kv"><div class="k">生活打卡 ${h ? `${hn} / 5` : ''}</div>
        <div class="habit-mini">${h ? HABITS.map(x => `<span class="${h[x.k] ? '' : 'no'}">${h[x.k] ? '✓' : '–'} ${x.t}</span>`).join('') : '<span class="no">沒有打卡</span>'}</div></div>
      <div class="meta">最後由 ${esc(nameOf(r.updated_by_name))} 更新於 ${timeStr(r.updated_at)}</div>
      <div class="btn-row"><button class="btn sm" data-action="editRec" data-date="${r.record_date}">編輯</button>

}

/* ---------- 回診摘要 ---------- */
const CA_RE = /CA\s*-?\s*125\D{0,8}?(\d+(?:\.\d+)?)/i;
function buildSummary(from, to) {
  const A = analyze(from, to), L = [];
  const yr = from.slice(0, 4) === to.slice(0, 4) ? `${from.slice(0, 4)} 年` : `${from.slice(0, 4)}–${to.slice(0, 4)} 年`;
  L.push(`回診摘要｜${md(from)}–${md(to)}（${yr}）`);
  L.push(`期間 ${A.N} 天，有身體紀錄 ${A.recDays} 天`);

  const tAsc = [...S.treatments].filter(t => t.treatment_date <= to).sort((a, b) => a.treatment_date.localeCompare(b.treatment_date));
  const inT = tAsc.filter(t => t.treatment_date >= from);
  L.push('', '最近治療：');
  if (inT.length) inT.forEach(t => L.push(`${md(t.treatment_date)} ${t.treatment_name}`));
  else if (tAsc.length) { const t = tAsc[tAsc.length - 1]; L.push(`期間內無；最近一次 ${t.treatment_date.replaceAll('-', '/')} ${t.treatment_name}`); }
  else L.push('尚無治療紀錄');

  L.push('', '主要症狀：');
  if (!A.recDays) L.push('期間內沒有身體紀錄');
  else if (!A.sorted.length) L.push('期間內沒有勾選任何狀況');
  else A.sorted.slice(0, 8).forEach(([s, c]) => L.push(`${s} ${c} 天`));

  L.push('', '症狀變化（與前一期 ' + `${md(A.pf)}–${md(A.pt)}` + ' 相比）：');
  if (!A.prev.length) L.push('前一期沒有紀錄，無法比較');
  else if (!A.changes.length) L.push('各症狀出現天數與前一期相同');
  else { A.changes.slice(0, 5).forEach(c => L.push(changeText(c))); L.push(`（前一期有紀錄 ${A.prev.length} 天，本期 ${A.recDays} 天）`); }

  if (A.recDays) {
    L.push('', '睡眠／熱潮紅相關：');
    ['熱潮紅', '夜間熱醒', '盜汗', '睡不好'].forEach(s => L.push(`${s} ${A.cnt[s] || 0} 天`));
    [['夜間熱醒', '睡不好'], ['熱潮紅', '睡不好']].forEach(([a, b]) => {
      const p = A.pair(a, b); if (p.aCount && p.c) L.push(`${a}的 ${p.aCount} 天中，有 ${p.c} 天同時睡不好`);
    });
    const mc = MOODS.filter(m => A.moodCnt[m.v]).map(m => `${m.t} ${A.moodCnt[m.v]} 天`);
    if (mc.length) L.push('', '整體感覺：', mc.join('、'));
  }

  if (A.flagged.length) {
    L.push('', '單側下腹痛附帶情況：');
    A.flagged.forEach(r => L.push(`${md(r.record_date)} ${(r.red_flags || []).join('、')}`));
  }

  L.push('', '生活紀錄：');
  if (A.habitAvg === null) L.push('期間內沒有生活打卡');
  else {
    L.push(`平均完成 ${A.habitAvg} 項生活打卡（${A.hDays} 天有打卡）`);
    L.push(HABITS.map(x => `${x.s} ${A.per[x.k] || 0} 天`).join('、'));
  }

  if (A.notes.length) {
    L.push('', '補充紀錄：');
    A.notes.slice(-15).forEach(r => L.push(`${md(r.record_date)} ${r.note.replace(/\s*\n\s*/g, '；')}`));
  }

  const withTests = tAsc.filter(t => t.test_results && t.test_results.trim());
  L.push('', '最近檢查：');
  if (withTests.length) {
    const t = withTests[withTests.length - 1];
    L.push(`（${t.treatment_date.replaceAll('-', '/')}）`);
    t.test_results.trim().split('\n').forEach(x => x.trim() && L.push(x.trim()));
  } else L.push('尚無檢查數值紀錄');

  const ca = withTests.map(t => { const m = t.test_results.match(CA_RE); return m ? `${md(t.treatment_date)} ${m[1]}` : null; }).filter(Boolean);
  if (ca.length >= 2) L.push('', 'CA-125 歷次紀錄：', ca.join('、'));

  const withNext = tAsc.filter(t => t.next_plan && t.next_plan.trim());
  L.push('', '下一步：');
  if (withNext.length) withNext[withNext.length - 1].next_plan.trim().split('\n').forEach(x => x.trim() && L.push(x.trim()));
  else L.push('尚未填寫');

  L.push('', '— 本摘要依使用者自行紀錄整理，供回診時提供醫師參考。');
  return L.join('\n');
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {}
    ta.remove(); return ok;
  }
}

async function saveTreat(id, btn) {
  const row = {
    treatment_date: $('f_date').value, treatment_name: $('f_name').value.trim(),
    test_results: $('f_tests').value.trim() || null, medical_summary: $('f_summary').value.trim() || null,
    next_plan: $('f_next').value.trim() || null, updated_by_name: S.who || null
  };
  if (!row.treatment_date || !row.treatment_name) { $('treatErr').textContent = '請填寫日期和治療內容'; return; }
  btn.disabled = true;
  const q = id ? sb.from('treatments').update(row).eq('id', id) : sb.from('treatments').insert({ ...row, care_space_id: S.space.id, created_by_name: S.who || null });
  const { data, error } = await q.select().single();
  if (error) { $('treatErr').textContent = '儲存失敗：' + error.message; btn.disabled = false; return; }
  const i = S.treatments.findIndex(t => t.id === data.id);
  if (i >= 0) S.treatments[i] = data; else S.treatments.push(data);
  S.treatments.sort((a, b) => b.treatment_date.localeCompare(a.treatment_date));
  S.openTreat.add(data.id);
  closeSheet(); renderTreat(); toast(id ? '已更新治療紀錄' : '已新增治療紀錄');
}

/* ---------- 從備份還原 ---------- */
function chunk(arr, n = 200) { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; }

async function restoreBackup(file) {
  let b;
  try { b = JSON.parse(await file.text()); } catch { return toast('這個檔案不是有效的備份檔'); }
  if (!b || !Array.isArray(b.daily_records) || !Array.isArray(b.treatments)) return toast('這個檔案不是治療生活紀錄的備份檔');
  const recs = b.daily_records.filter(r => r && /^\d{4}-\d{2}-\d{2}$/.test(r.record_date || ''));
  const habits = Array.isArray(b.daily_habits) ? b.daily_habits : [];
  const treats = b.treatments.filter(t => t && t.treatment_date && t.treatment_name);
  const notes = (Array.isArray(b.shared_notes) ? b.shared_notes : (b.shared_note ? [b.shared_note] : [])).filter(n => n && n.content && n.content.trim());
  const when = b.exported_at ? timeStr(b.exported_at) : '未知時間';
  if (!confirm(`要從 ${when} 匯出的備份還原嗎？\n\n每日紀錄 ${recs.length} 筆、治療紀錄 ${treats.length} 筆、留言 ${notes.length} 則\n\n・同一天已有的每日紀錄，會被備份內容覆蓋\n・備份裡沒有的紀錄會保留，不會被刪除`)) return;

  closeSheet();
  toast('還原中，請稍候…');
  const sid = S.space.id;
  const done = { recs: 0, habits: 0, treats: 0, notes: 0, notesSkipped: 0 };
  try {
    // 每日紀錄（依日期對應）
    const dateOfOld = {}; recs.forEach(r => { if (r.id) dateOfOld[r.id] = r.record_date; });
    const newIdByDate = {};
    for (const part of chunk(recs)) {
      const rows = part.map(r => ({
        care_space_id: sid, record_date: r.record_date, mood: r.mood ?? null,
        symptoms: Array.isArray(r.symptoms) ? r.symptoms : [], red_flags: Array.isArray(r.red_flags) ? r.red_flags : [],
        note: r.note ?? null, updated_by_name: r.updated_by_name ?? null
      }));
      const { data, error } = await sb.from('daily_records').upsert(rows, { onConflict: 'care_space_id,record_date' }).select('id,record_date');
      if (error) throw error;
      (data || []).forEach(x => newIdByDate[x.record_date] = x.id);
      done.recs += rows.length;
    }
    // 生活打卡
    const hRows = habits.map(h => {
      const id = newIdByDate[dateOfOld[h.daily_record_id]]; if (!id) return null;
      const o = { daily_record_id: id, care_space_id: sid }; HABITS.forEach(x => o[x.k] = !!h[x.k]); return o;
    }).filter(Boolean);
    for (const part of chunk(hRows)) {
      const { error } = await sb.from('daily_habits').upsert(part, { onConflict: 'daily_record_id' });
      if (error) throw error;
      done.habits += part.length;
    }
    // 治療紀錄（同一筆以 id 對應，不會重複）
    const tRows = treats.map(t => ({
      ...(t.id ? { id: t.id } : {}), care_space_id: sid, treatment_date: t.treatment_date, treatment_name: t.treatment_name,
      medical_summary: t.medical_summary ?? null, next_plan: t.next_plan ?? null, test_results: t.test_results ?? null,
      created_by_name: t.created_by_name ?? null, updated_by_name: t.updated_by_name ?? null
    }));
    for (const t of tRows) {
      const { error } = t.id ? await sb.from('treatments').upsert(t, { onConflict: 'id' }) : await sb.from('treatments').insert(t);
      if (error) throw error;
      done.treats++;
    }
    // 留言板（最多 3 則）
    const have = new Set(S.notes.map(n => n.id)); let count = S.notes.length;
    for (const n of notes) {
      if (n.id && have.has(n.id)) {
        const { error } = await sb.from('shared_notes').update({ content: n.content, updated_by_name: n.updated_by_name ?? null }).eq('id', n.id);
        if (error) throw error; done.notes++;
      } else if (count < 3) {
        const { error } = await sb.from('shared_notes').insert({ ...(n.id ? { id: n.id } : {}), care_space_id: sid, content: n.content, updated_by_name: n.updated_by_name ?? null });
        if (error) throw error; done.notes++; count++;
      } else done.notesSkipped++;
    }
    // 名字清單
    const people = [...new Set([...(S.space.people || []), ...((b.space && Array.isArray(b.space.people)) ? b.space.people : [])])];
    if (people.length !== (S.space.people || []).length) {
      const { data } = await sb.from('care_spaces').update({ people }).eq('id', sid).select().single();
      if (data) S.space = data;
    }
    await loadAll(); setTodayDate(S.today.date, true); renderAll();
    alert(`還原完成\n\n每日紀錄 ${done.recs} 筆\n生活打卡 ${done.habits} 筆\n治療紀錄 ${done.treats} 筆\n留言 ${done.notes} 則` +
      (done.notesSkipped ? `\n\n留言板已滿 3 則，有 ${done.notesSkipped} 則沒有還原` : ''));
  } catch (e) {
    await loadAll(); renderAll();
    alert(`還原到一半停止了：${friendlyError(e)}\n\n已寫入：每日紀錄 ${done.recs} 筆、生活打卡 ${done.habits} 筆、治療 ${done.treats} 筆、留言 ${done.notes} 則。可以修正問題後再還原一次，不會產生重複紀錄。`);
  }
}

      err.style.color = '';
      const m = e.message || '';
      err.textContent = /fetch|network|Load failed/i.test(m) ? friendlyError(e) :
        /Invalid login/i.test(m) ? 'Email 或密碼不正確' :
        /not confirmed/i.test(m) ? '信箱尚未確認，請先點確認信中的連結' :
        /already registered/i.test(m) ? '這個帳號已經建立過，請直接登入' : m;
    } finally { el.disabled = false; }
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]'); if (!el) return;
  const fn = actions[el.dataset.action]; if (!fn) return;
  if (el.tagName === 'BUTTON') e.preventDefault();
  fn(el, e);
});
document.addEventListener('input', e => {
  if (e.target.dataset.bind === 'todayNote') { S.today.note = e.target.value; S.today.dirty = true; }
});
document.addEventListener('change', e => {
  const b = e.target.dataset.bind, v = e.target.value;
  switch (b) {
    case 'dateJump': if (v && v <= todayStr()) setTodayDate(v); else renderDateBar(); break;
    case 'trendPFrom': S.trend.from = v; renderTrend(); break;
    case 'trendPTo': S.trend.to = v; renderTrend(); break;
    case 'sumPFrom': S.sum.from = v; renderSummarySheet(); break;
    case 'sumPTo': S.sum.to = v; renderSummarySheet(); break;
    case 'recSearch': S.recSearch = v; renderRecords(); break;
    case 'treatSearch': S.treatSearch = v; renderTreat(); break;
    case 'restoreFile': { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) restoreBackup(f); break; }
  }
});
document.addEventListener('toggle', e => {
  const d = e.target; if (!d.matches || !d.matches('details.acc')) return;
  const set = d.dataset.kind === 'rec' ? S.openRec : S.openTreat;
  d.open ? set.add(d.dataset.id) : set.delete(d.dataset.id);
}, true);
window.addEventListener('afterprint', () => document.body.classList.remove('print-summary'));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !S.sheetLocked && !$('sheet').classList.contains('hidden')) closeSheet(); });

/* ---------- 示範模式（沒填 CONFIG 時使用，資料只在記憶體） ---------- */
function createMockClient() {
  const uid = 'demo-user', now = () => new Date().toISOString();
  const rid = () => Math.random().toString(36).slice(2) + Date.now().toString(36);
  const db = { care_spaces: [], care_space_members: [], daily_records: [], daily_habits: [], treatments: [], shared_notes: [] };
  const DEF = {
    daily_records: { mood: null, symptoms: [], red_flags: [], note: null, updated_by_name: null },
    daily_habits: { calcium: false, protein: false, exercise: false, water: false, no_heavy_alcohol: false },
    treatments: { medical_summary: null, next_plan: null, test_results: null, created_by_name: null, updated_by_name: null },
    shared_notes: { content: '', updated_by_name: null }, care_spaces: { people: [] }, care_space_members: {}
  };
  const clone = x => x == null ? x : JSON.parse(JSON.stringify(x));
  const make = (t, p) => ({ id: rid(), ...DEF[t], ...p, created_at: now(), updated_at: now() });
  class Q {
    constructor(t) { this.t = t; this.op = null; this.f = []; this.o = []; this.mode = 'many'; this.lim = null; }
    select() { if (!this.op) this.op = 'select'; return this; }
    eq(c, v) { this.f.push(r => r[c] === v); return this; }
    order(c, o = {}) { this.o.push([c, o.ascending !== false]); return this; }
    limit(n) { this.lim = n; return this; }
    single() { this.mode = 'single'; return this; }
    maybeSingle() { this.mode = 'maybe'; return this; }
    insert(p) { this.op = 'insert'; this.p = p; return this; }
    update(p) { this.op = 'update'; this.p = p; return this; }
    upsert(p, o = {}) { this.op = 'upsert'; this.p = p; this.keys = (o.onConflict || 'id').split(','); return this; }
    delete() { this.op = 'delete'; return this; }
    run() {
      const T = db[this.t], match = r => this.f.every(fn => fn(r)); let rows;
      if (this.op === 'insert') { rows = [make(this.t, clone(this.p))]; T.push(rows[0]); }
      else if (this.op === 'upsert') {
        rows = (Array.isArray(this.p) ? this.p : [this.p]).map(p => {
          let r = T.find(x => this.keys.every(k => x[k] === p[k]));
          if (r) Object.assign(r, clone(p), { updated_at: now() }); else { r = make(this.t, clone(p)); T.push(r); }
          return r;
        });
      } else if (this.op === 'update') { rows = T.filter(match); rows.forEach(r => Object.assign(r, clone(this.p), { updated_at: now() })); }
      else if (this.op === 'delete') {
        rows = T.filter(match); db[this.t] = T.filter(r => !rows.includes(r));
        if (this.t === 'daily_records') { const ids = rows.map(r => r.id); db.daily_habits = db.daily_habits.filter(h => !ids.includes(h.daily_record_id)); }
      } else rows = T.filter(match);
      rows = [...rows];
      [...this.o].reverse().forEach(([c, asc]) => rows.sort((a, b) => (a[c] < b[c] ? -1 : a[c] > b[c] ? 1 : 0) * (asc ? 1 : -1)));
      if (this.lim != null) rows = rows.slice(0, this.lim);
      if (this.mode === 'single') return rows.length === 1 ? { data: clone(rows[0]), error: null } : { data: null, error: { message: '找不到資料' } };
      if (this.mode === 'maybe') return { data: clone(rows[0] || null), error: null };
      return { data: clone(rows), error: null };
    }
    then(a, b) { return Promise.resolve().then(() => this.run()).then(a, b); }
  }

  // 示範用假資料
  const sid = rid();
  db.care_spaces.push({ id: sid, name: '示範空間', people: ['小安', '阿哲'], created_at: now() });
  db.care_space_members.push({ care_space_id: sid, user_id: uid, role: 'owner', joined_at: now() });
  db.shared_notes.push(make('shared_notes', { care_space_id: sid, content: '下次回診記得問柳培林療程', updated_by_name: '阿哲' }));
  db.shared_notes.push(make('shared_notes', { care_space_id: sid, content: '晚上幫忙記得補紀錄', updated_by_name: '小安' }));
  db.treatments.push(make('treatments', { care_space_id: sid, treatment_date: '2026-09-23', treatment_name: '施打柳培林',
    test_results: 'CA-125 102.8\n右側巧克力囊腫：\n5 cm\n3 cm\n2 cm\n2 cm',
    medical_summary: '以巧克力囊腫／子宮內膜異位症方向治療，後續追蹤症狀及影像變化。',
    next_plan: '確認柳培林療程長度\n確認下次超音波時間\n確認 CA-125 複驗時間', created_by_name: '小安', updated_by_name: '小安' }));
  let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const t0 = todayStr();
  for (let i = 1; i <= 24; i++) {
    const d = addDays(t0, -i); if (rnd() < 0.15) continue;
    const late = i <= 9, syms = [];
    const pr = { '夜間熱醒': late ? .6 : .25, '熱潮紅': late ? .5 : .2, '睡不好': .3, '疲倦': .3, '腹部悶痛': .3, '腹脹': .2, '頭痛': .12, '情緒波動': .15 };
    Object.entries(pr).forEach(([k, v]) => { if (rnd() < v) syms.push(k); });
    if (syms.includes('夜間熱醒') && !syms.includes('睡不好') && rnd() < .6) syms.push('睡不好');
    syms.sort((a, b) => SYMPTOMS.indexOf(a) - SYMPTOMS.indexOf(b));
    const mood = syms.length >= 4 ? 'uncomfortable' : syms.length >= 2 ? 'ok' : 'good';
    const note = i === 2 ? '晚上熱醒 2 次' : i === 5 ? '右下腹悶痛約 3/10' : null;
    const rec = make('daily_records', { care_space_id: sid, record_date: d, mood, symptoms: syms, note, updated_by_name: rnd() < .5 ? '小安' : '阿哲' });
    db.daily_records.push(rec);
    const h = {}; HABITS.forEach(x => h[x.k] = rnd() < .65);
    db.daily_habits.push(make('daily_habits', { daily_record_id: rec.id, care_space_id: sid, ...h }));
  }

  let cb = null, session = { user: { id: uid, email: 'demo@example.com' } };
  const login = async () => { session = { user: { id: uid, email: 'demo@example.com' } }; return { data: { user: session.user, session }, error: null }; };
  return {
    from: t => new Q(t),
    rpc: async () => ({ data: null, error: { message: '示範模式不支援' } }),
    auth: {
      getSession: async () => ({ data: { session } }),
      onAuthStateChange: f => { cb = f; return { data: { subscription: { unsubscribe() {} } } }; },
      signOut: async () => { session = null; cb && cb('SIGNED_OUT', null); return { error: null }; },
      signInWithPassword: login, signUp: login
    },
    channel: () => { const ch = { on: () => ch, subscribe: f => { setTimeout(() => f('SUBSCRIBED')); return ch; } }; return ch; },
    removeChannel: () => {}
  };
}

init().catch(err => { console.error(err); show('auth'); toast('啟動失敗：' + err.message); });
